<section class="section">
  <h3>Enter a SSIN (Social Security Identification Number)</h3>
  <mat-form-field appearance="outline" class="search-field">
    <!-- TODO automatically remove non allowed characters -->
    <mat-label>Please enter the SSIN (digits are sufficient)</mat-label>
    <input matInput [(ngModel)]="inputSsin" placeholder="99123100069 or 99.12.31-000.69" maxlength="15"/>
  </mat-form-field>

  <h3>Formatted SSIN</h3>
  <mat-form-field appearance="outline" class="display-field">
    <mat-label>Properly formatted ssin</mat-label>
    <input matInput [value]="formattedSsin()" disabled="true"/>
  </mat-form-field>

  <mat-form-field appearance="outline" class="display-field">
    <mat-label>Pure ssin - only digits</mat-label>
    <input matInput [value]="pureSsin()" disabled="true"/>
  </mat-form-field>

</section>
